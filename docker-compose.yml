version: "3.9"

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bets
      MYSQL_USER: app
      MYSQL_PASSWORD: secret
    volumes:
      - db:/var/lib/mysql
    command: ["--default-authentication-plugin=mysql_native_password"]

  backend:
    build:
      context: ./backend
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      - mysql
    volumes:
      - ./backend:/var/www/html

  nginx:
    build:
      context: ./backend/docker/nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html

  frontend:
    build: ./frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    environment:
      VUE_APP_API_URL: http://localhost:8080/api
    ports:
      - "5173:5173"
    depends_on:
      - nginx
    command: ["npm", "run", "serve", "--", "--host", "0.0.0.0", "--port", "5173"]

volumes:
  db: {}
